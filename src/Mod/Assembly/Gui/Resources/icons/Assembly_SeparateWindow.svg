<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" version="1.1" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="windowGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E5C8A;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Left Window -->
  <g id="leftWindow">
    <!-- Window frame -->
    <rect x="4" y="12" width="26" height="40" rx="2" ry="2" 
          fill="url(#windowGradient)" stroke="#1A3A5A" stroke-width="2"/>
    <!-- Title bar -->
    <rect x="4" y="12" width="26" height="6" rx="2" ry="2" 
          fill="#1A3A5A" opacity="0.8"/>
    <!-- Title bar dots -->
    <circle cx="8" cy="15" r="1.2" fill="#FF5F57"/>
    <circle cx="12" cy="15" r="1.2" fill="#FFBD2E"/>
    <circle cx="16" cy="15" r="1.2" fill="#28CA42"/>
    <!-- Content area lines -->
    <rect x="8" y="22" width="18" height="2" rx="1" fill="#E8F4FF" opacity="0.7"/>
    <rect x="8" y="28" width="14" height="2" rx="1" fill="#E8F4FF" opacity="0.5"/>
    <rect x="8" y="34" width="16" height="2" rx="1" fill="#E8F4FF" opacity="0.5"/>
  </g>
  
  <!-- Right Window -->
  <g id="rightWindow">
    <!-- Window frame -->
    <rect x="34" y="12" width="26" height="40" rx="2" ry="2" 
          fill="url(#windowGradient)" stroke="#1A3A5A" stroke-width="2"/>
    <!-- Title bar -->
    <rect x="34" y="12" width="26" height="6" rx="2" ry="2" 
          fill="#1A3A5A" opacity="0.8"/>
    <!-- Title bar dots -->
    <circle cx="38" cy="15" r="1.2" fill="#FF5F57"/>
    <circle cx="42" cy="15" r="1.2" fill="#FFBD2E"/>
    <circle cx="46" cy="15" r="1.2" fill="#28CA42"/>
    <!-- Content area - 3D cube to represent component -->
    <g transform="translate(43, 28)">
      <!-- Front face -->
      <path d="M 0,6 L 8,10 L 8,18 L 0,14 Z" fill="#5BA3E8" stroke="#2E5C8A" stroke-width="0.8"/>
      <!-- Top face -->
      <path d="M 0,6 L 8,2 L 16,6 L 8,10 Z" fill="#87C5FF" stroke="#2E5C8A" stroke-width="0.8"/>
      <!-- Right face -->
      <path d="M 8,10 L 16,6 L 16,14 L 8,18 Z" fill="#3D7AB8" stroke="#2E5C8A" stroke-width="0.8"/>
    </g>
  </g>
  
  <!-- Divider line between windows -->
  <line x1="32" y1="14" x2="32" y2="50" stroke="#1A3A5A" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Arrow indicating separate action -->
  <g id="separateArrow" transform="translate(28, 8)">
    <!-- Left arrow -->
    <path d="M 0,2 L -4,0 L 0,-2" fill="none" stroke="#FF5F57" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right arrow -->
    <path d="M 8,2 L 12,0 L 8,-2" fill="none" stroke="#FF5F57" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
