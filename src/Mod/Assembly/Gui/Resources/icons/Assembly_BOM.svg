  <line x1="36" y1="35" x2="50" y2="35" stroke="#555753" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="14" y1="43" x2="22" y2="43" stroke="#555753" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="36" y1="43" x2="44" y2="43" stroke="#555753" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="14" y1="51" x2="28" y2="51" stroke="#555753" stroke-width="1.5" stroke-linecap="round"/>
