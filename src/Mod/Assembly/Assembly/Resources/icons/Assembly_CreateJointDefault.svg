<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="64px"
   height="64px"
   viewBox="0 0 64 64"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">

  <!-- X-axis (red, going right) — thick line + big filled arrowhead -->
  <line x1="30" y1="36" x2="54" y2="36" stroke="#dd2222" stroke-width="5" stroke-linecap="round"/>
  <polygon points="63,36 52,30 52,42" fill="#dd2222"/>

  <!-- Y-axis (green, going up) — thick line + big filled arrowhead -->
  <line x1="30" y1="36" x2="30" y2="10" stroke="#33bb33" stroke-width="5" stroke-linecap="round"/>
  <polygon points="30,1 24,12 36,12" fill="#33bb33"/>

  <!-- Z-axis (blue, diagonal toward viewer) — thick line + big filled arrowhead -->
  <line x1="30" y1="36" x2="10" y2="56" stroke="#1ceff3" stroke-width="5" stroke-linecap="round"/>
  <polygon points="3,63 3,52 14,52" fill="#1ceff3"/>

  <!-- Origin sphere (bold dark circle with highlight) -->
  <circle cx="30" cy="36" r="6" fill="#444444" stroke="#222222" stroke-width="1.5"/>
  <circle cx="28" cy="34" r="2" fill="#888888"/>

</svg>
