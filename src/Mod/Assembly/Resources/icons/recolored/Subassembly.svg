<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  CreateSubassembly.svg
  FreeCAD "Create Subassembly" macro - toolbar icon
  Based on the upstream FreeCAD AssemblyWorkbench.svg multi-cube layout,
  with colors changed: YELLOW -> RED (Assembly X-axis red).
  Result palette: RED + BLUE + GREEN (matches Assembly axis colors).
-->
<svg
   xmlns="http://www.w3.org/2000/svg"
   xmlns:xlink="http://www.w3.org/1999/xlink"
   width="64"
   height="64"
   version="1.1"
   viewBox="0 0 64 64">
  <defs>
    <!-- Blue gradient (kept) -->
    <linearGradient id="gBlue">
      <stop stop-color="#088f8f" offset="0"/>
      <stop stop-color="#088f8f" offset="1"/>
    </linearGradient>
    <!-- Green gradient (kept) -->
    <linearGradient id="gGreen">
      <stop stop-color="#4e9a06" offset="0"/>
      <stop stop-color="#8ae234" offset="1"/>
    </linearGradient>
    <!-- RED gradient (replaces yellow #c17d0c -> #f39c12) -->
    <linearGradient id="gRed">
      <stop stop-color="#B71C1C" offset="0"/>
      <stop stop-color="#FF6464" offset="1"/>
    </linearGradient>
    <!-- RED-bright gradient (replaces yellow #c17d0c -> #ffe066) -->
    <linearGradient id="gRedBright">
      <stop stop-color="#B71C1C" offset="0"/>
      <stop stop-color="#FF9090" offset="1"/>
    </linearGradient>

    <linearGradient id="linearGradient4389" x1="20.244" x2="17.244" y1="37.588" y2="27.588"
       gradientTransform="translate(-1.2435,-2.5881)" gradientUnits="userSpaceOnUse" xlink:href="#gGreen"/>
    <linearGradient id="linearGradient4399" x1="48.714" x2="44.714" y1="45.586" y2="34.586"
       gradientTransform="translate(1.2856,1.4142)" gradientUnits="userSpaceOnUse" xlink:href="#gRed"/>
    <linearGradient id="linearGradient69042" x1="48.714" x2="44.714" y1="45.586" y2="34.586"
       gradientTransform="translate(-12.714,-17.586)" gradientUnits="userSpaceOnUse" xlink:href="#gGreen"/>
    <linearGradient id="linearGradient69056" x1="27.244" x2="22.244" y1="54.588" y2="40.588"
       gradientTransform="translate(-1.2435,-2.5881)" gradientUnits="userSpaceOnUse" xlink:href="#gRedBright"/>
    <linearGradient id="linearGradient69709" x1="20.244" x2="17.244" y1="37.588" y2="27.588"
       gradientTransform="matrix(1,-0.026667,0,1,81.696,-5.3735)" gradientUnits="userSpaceOnUse" xlink:href="#gBlue"/>
    <linearGradient id="linearGradient69717" x1="50.714" x2="48.714" y1="25.586" y2="20.586"
       gradientTransform="translate(61.2256,1.0356)" gradientUnits="userSpaceOnUse" xlink:href="#gBlue"/>
    <linearGradient xlink:href="#linearGradient69056" id="linearGradient920" gradientUnits="userSpaceOnUse"
       gradientTransform="translate(-41.2435,-2.5881)" x1="20.243999" y1="37.588001" x2="17.243999" y2="27.587999"/>
    <linearGradient xlink:href="#linearGradient4399" id="linearGradient922" gradientUnits="userSpaceOnUse"
       gradientTransform="translate(-52.714,-17.586)" x1="48.714001" y1="45.585999" x2="44.714001" y2="34.585999"/>
  </defs>

  <!-- ════════ LOWER CUBE PAIR (was yellow, now RED) ════════ -->
  <g style="stroke-width:2">
    <path d="M 9,49 V 35 l 28,10 v 14 z"
          style="fill:url(#linearGradient69056);stroke:#5A0A0A;stroke-linejoin:round;stroke-width:2"/>
    <path d="M 37,59 V 45 L 55,28 v 13 z"
          style="fill:url(#linearGradient4399);stroke:#5A0A0A;stroke-linejoin:round;stroke-width:2"/>
    <path d="M 11.008,47.606 11,37.9997 l 24,8 0.0081,10.185 z"
          style="fill:none;stroke:#FF9090;stroke-width:2"/>
    <path d="M 39.005,54.168 39,45.9998 l 14,-13 0.0021,7.1768 z"
          style="fill:none;stroke:#FF6464;stroke-width:2"/>
    <path d="M 23,40 42,23 55,28 37,45 Z"
          style="fill:#FF9090;stroke:#5A0A0A;stroke-linejoin:round;stroke-width:2"/>
  </g>

  <!-- ════════ UPPER-RIGHT BLUE CUBE (kept) ════════ -->
  <g transform="translate(-60)">
    <path d="m 91,33.5 -0.02739,-14.214 12.967,4.3352 v 14.5 z"
          style="fill:url(#linearGradient69709);stroke:#044a4a;stroke-width:2;stroke-linejoin:round"/>
    <path d="m 92.927,32.029 0.04731,-10.141 8.9272,3.29 0.0781,10.042 z"
          style="fill:none;stroke:#088f8f;stroke-width:2"/>
    <path d="m 103.94,38.121 v -14.5 l 11,-9 L 115,28 Z"
          style="fill:url(#linearGradient69717);stroke:#044a4a;stroke-width:2;stroke-linejoin:round"/>
    <path d="m 105.94,33.621 v -9 l 7,-6 -0.0122,8.5816 z"
          style="fill:none;stroke:#088f8f;stroke-width:2"/>
    <path d="M 90.973,19.286 102,9.9998 l 12.94,4.6214 -11,9 z"
          style="fill:#088f8f;stroke:#044a4a;stroke-width:2;stroke-linejoin:round"/>
  </g>

  <!-- ════════ UPPER-LEFT GREEN + RED CUBE PAIR ════════ -->
  <g transform="translate(40)">
    <g style="stroke:#172a04;stroke-width:2;stroke-linejoin:round" transform="translate(-40)">
      <path style="fill:url(#linearGradient4389)" d="M 9,35 V 21 l 14,5 v 14 z"/>
      <path style="fill:#8ae234" d="M 9,21 28.585,5.209 42,10.0001 l -19,16 z"/>
      <path style="fill:url(#linearGradient69042)" d="M 23,40 V 26 l 7.9726,-6.7138 0.02739,13.714 z"/>
    </g>
    <!-- (was yellow, now RED) -->
    <path style="fill:url(#linearGradient920);fill-opacity:1;stroke:#5A0A0A;stroke-width:2;stroke-linejoin:round"
          d="M -31,35 V 21 l 14,5 v 14 z"/>
    <path style="fill:#FF9090;fill-opacity:1;stroke:#5A0A0A;stroke-width:2;stroke-linejoin:round;stroke-opacity:1"
          d="M -31,21 -11.415,5.209 2,10.0001 l -19,16 z"/>
    <path style="fill:url(#linearGradient922);fill-opacity:1;stroke:#5A0A0A;stroke-width:2;stroke-linejoin:round"
          d="M -17,40 V 26 l 7.9726,-6.7138 0.02739,13.714 z"/>
    <path d="m -15,36 v -9 l 4,-3.5 v 9 z"
          style="fill:none;stroke:#FF9090;stroke-width:2;stroke-opacity:1"/>
    <path d="m -29.049,33.746 0.08695,-9.9796 9.9568,3.5229 -0.02105,9.9613 z"
          style="fill:none;stroke:#FF9090;stroke-width:2;stroke-opacity:1"/>
  </g>
</svg>
