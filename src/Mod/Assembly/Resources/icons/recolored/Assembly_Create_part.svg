<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- BNC: Create New Part - cube with plus sign -->
  <!-- 3D cube body -->
  <polygon points="32,8 54,20 54,44 32,56 10,44 10,20" fill="#088f8f" stroke="#056b6b" stroke-width="2" stroke-linejoin="round"/>
  <!-- cube top face -->
  <polygon points="32,8 54,20 32,32 10,20" fill="#088f8f" stroke="#056b6b" stroke-width="2" stroke-linejoin="round"/>
  <!-- cube left face -->
  <polygon points="10,20 32,32 32,56 10,44" fill="#088f8f" stroke="#056b6b" stroke-width="2" stroke-linejoin="round"/>
  <!-- cube right face -->
  <polygon points="54,20 32,32 32,56 54,44" fill="#088f8f" stroke="#056b6b" stroke-width="2" stroke-linejoin="round"/>
  <!-- Green plus circle -->
  <circle cx="50" cy="50" r="12" fill="#73d216" stroke="#4e9a06" stroke-width="2"/>
  <rect x="46" y="45" width="8" height="10" rx="1" fill="white"/>
  <rect x="45" y="46" width="10" height="8" rx="1" fill="white"/>
</svg>
