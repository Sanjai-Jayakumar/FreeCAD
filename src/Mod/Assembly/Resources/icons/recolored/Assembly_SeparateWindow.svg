<?xml version="1.0" encoding="UTF-8"?>
<!--
  SeparateWindow.svg
  FreeCAD "Separate Window" macro - toolbar icon
  Size   : 24 x 24 px (native FreeCAD toolbar size)
  Concept: two overlapping windows filling the canvas - back window in
           blue (the original main view) and a yellow-titled front window
           popped out from it. Big, bold, instantly readable.
  Palette: Yellow + blue FreeCAD Assembly theme.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="24" height="24"
     viewBox="0 0 24 24">

  <defs>
    <linearGradient id="winBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2EBF5"/>
    </linearGradient>
    <linearGradient id="titleBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#088f8f"/>
      <stop offset="100%" stop-color="#088f8f"/>
    </linearGradient>
    <linearGradient id="titleYellow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#f39c12"/>
    </linearGradient>
    <linearGradient id="cubeBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#088f8f"/>
      <stop offset="100%" stop-color="#088f8f"/>
    </linearGradient>
  </defs>

  <!-- ════════ BACK WINDOW (main / original) ════════ -->
  <!-- Window body -->
  <rect x="0.5" y="0.5"
        width="16" height="16"
        rx="1.2"
        fill="url(#winBody)"
        stroke="#056b6b" stroke-width="1.3"/>
  <!-- Blue title bar -->
  <rect x="0.5" y="0.5"
        width="16" height="3.5"
        rx="1.2"
        fill="url(#titleBlue)"
        stroke="#056b6b" stroke-width="1.3"/>
  <line x1="0.5" y1="4" x2="16.5" y2="4"
        stroke="#056b6b" stroke-width="1.0"/>
  <!-- Window controls (3 dots) -->
  <circle cx="2.3" cy="2.25" r="0.55" fill="#FFFFFF"/>
  <circle cx="3.9" cy="2.25" r="0.55" fill="#FFFFFF"/>
  <circle cx="5.5" cy="2.25" r="0.55" fill="#FFFFFF"/>

  <!-- Small iso cube visible in back window (upper-left content) -->
  <g>
    <polygon points="3,9  5,10  5,12  3,11"
             fill="#056b6b"
             stroke="#056b6b" stroke-width="0.4"
             stroke-linejoin="round"/>
    <polygon points="7,9  5,10  5,12  7,11"
             fill="#088f8f"
             stroke="#056b6b" stroke-width="0.4"
             stroke-linejoin="round"/>
    <polygon points="5,8  7,9  5,10  3,9"
             fill="url(#cubeBlue)"
             stroke="#056b6b" stroke-width="0.4"
             stroke-linejoin="round"/>
  </g>

  <!-- ════════ FRONT WINDOW (separated, popped out) ════════ -->
  <!-- Window body -->
  <rect x="7.5" y="7.5"
        width="16" height="16"
        rx="1.2"
        fill="url(#winBody)"
        stroke="#056b6b" stroke-width="1.3"/>
  <!-- Yellow title bar (highlighted = the active separated window) -->
  <rect x="7.5" y="7.5"
        width="16" height="3.5"
        rx="1.2"
        fill="url(#titleYellow)"
        stroke="#056b6b" stroke-width="1.3"/>
  <line x1="7.5" y1="11" x2="23.5" y2="11"
        stroke="#056b6b" stroke-width="1.0"/>
  <!-- Window controls on yellow title -->
  <circle cx="9.3" cy="9.25" r="0.55" fill="#6e4a0a"/>
  <circle cx="10.9" cy="9.25" r="0.55" fill="#6e4a0a"/>
  <circle cx="12.5" cy="9.25" r="0.55" fill="#6e4a0a"/>

  <!-- Iso cube in front window (the separated component) -->
  <g>
    <polygon points="13,17  16,18.5  16,21  13,19.5"
             fill="#056b6b"
             stroke="#056b6b" stroke-width="0.5"
             stroke-linejoin="round"/>
    <polygon points="19,17  16,18.5  16,21  19,19.5"
             fill="#088f8f"
             stroke="#056b6b" stroke-width="0.5"
             stroke-linejoin="round"/>
    <polygon points="16,15.5  19,17  16,18.5  13,17"
             fill="url(#cubeBlue)"
             stroke="#056b6b" stroke-width="0.5"
             stroke-linejoin="round"/>
    <!-- Top rim highlight -->
    <polyline points="13.5,17  16,15.7  18.5,17"
              fill="none" stroke="#088f8f"
              stroke-width="0.4" stroke-linecap="round"
              opacity="0.85"/>
  </g>

</svg>
