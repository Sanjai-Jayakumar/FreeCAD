<?xml version="1.0" encoding="UTF-8"?>
<!--
  Rename.svg
  FreeCAD "Rename" macro - toolbar icon
  Size   : 24 x 24 px (native FreeCAD toolbar size)
  Concept: large iso 3D file/document filling the canvas with a yellow
           pencil/edit badge in the lower-right corner. Matches the
           SetWorkingDirectory "big primary subject + corner badge" pattern.
  Palette: Yellow + blue FreeCAD Assembly theme.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="24" height="24"
     viewBox="0 0 24 24">

  <defs>
    <linearGradient id="docFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#7FC4ED"/>
      <stop offset="100%" stop-color="#2E78B5"/>
    </linearGradient>
    <linearGradient id="docFoldFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#3D8BC7"/>
      <stop offset="100%" stop-color="#0F3F8F"/>
    </linearGradient>
    <radialGradient id="badgeBg" cx="0.35" cy="0.35" r="0.85">
      <stop offset="0%"   stop-color="#FFEE99"/>
      <stop offset="55%"  stop-color="#FFCC00"/>
      <stop offset="100%" stop-color="#8A6800"/>
    </radialGradient>
    <linearGradient id="pencilFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E5A700"/>
    </linearGradient>
  </defs>

  <!-- ════════ BIG 3D FILE / DOCUMENT (fills canvas) ════════ -->

  <!-- Page back-shadow (right depth strip) -->
  <path d="M 21,2.5 L 23,4.5 L 23,22 L 21,22 Z"
        fill="#0A2E60"
        stroke="#0A2E60" stroke-width="0.6"
        stroke-linejoin="round"/>

  <!-- Page bottom-shadow strip -->
  <path d="M 2,22 L 21,22 L 23,22 L 4,22 Z"
        fill="#0A2E60"/>

  <!-- Main page front face with folded upper-right corner -->
  <path d="M 1.5,2.5
           L 17,2.5
           L 21,6.5
           L 21,21.5
           L 1.5,21.5 Z"
        fill="url(#docFront)"
        stroke="#0A2E60" stroke-width="1.3"
        stroke-linejoin="round"/>

  <!-- Folded corner triangle -->
  <path d="M 17,2.5 L 17,6.5 L 21,6.5 Z"
        fill="url(#docFoldFront)"
        stroke="#0A2E60" stroke-width="1.0"
        stroke-linejoin="round"/>

  <!-- Top-edge specular highlight -->
  <line x1="2.3" y1="3.2" x2="16" y2="3.2"
        stroke="#CCE6F5" stroke-width="0.6"
        opacity="0.85" stroke-linecap="round"/>

  <!-- Filename / name field area (light strip at top) -->
  <rect x="3" y="5.5" width="13" height="2.5"
        rx="0.4"
        fill="#FFFFFF" opacity="0.85"/>

  <!-- Body content lines on the page -->
  <line x1="3" y1="11" x2="18" y2="11"
        stroke="#FFFFFF" stroke-width="1.0"
        stroke-linecap="round" opacity="0.85"/>
  <line x1="3" y1="14" x2="16" y2="14"
        stroke="#FFFFFF" stroke-width="1.0"
        stroke-linecap="round" opacity="0.75"/>
  <line x1="3" y1="17" x2="17" y2="17"
        stroke="#FFFFFF" stroke-width="1.0"
        stroke-linecap="round" opacity="0.65"/>

  <!-- ════════ PENCIL / EDIT BADGE (lower-right corner) ════════ -->
  <g transform="translate(17.5 17.5)">

    <!-- Badge background circle -->
    <circle r="6.0"
            fill="url(#badgeBg)"
            stroke="#1a1a1a" stroke-width="1.0"/>

    <!-- Subtle highlight arc -->
    <path d="M -3.2,-2.8 A 4.2,4.2 0 0 1 2.8,-3.2"
          fill="none" stroke="#FFFFFF"
          stroke-width="0.6" stroke-linecap="round"
          opacity="0.75"/>

    <!-- ── Pencil drawn inside the badge (diagonal -45°) ── -->
    <g transform="rotate(-45)">
      <!-- Graphite tip -->
      <polygon points="-0.9,3.6  0.9,3.6  0,5.3"
               fill="#1a1a1a"/>
      <!-- Wood cone -->
      <polygon points="-1.5,2.4  1.5,2.4  0.9,3.6  -0.9,3.6"
               fill="#D9B080"
               stroke="#1a1a1a" stroke-width="0.3"
               stroke-linejoin="round"/>
      <!-- Pencil body -->
      <rect x="-1.5" y="-3.0" width="3.0" height="5.4"
            fill="url(#pencilFill)"
            stroke="#1a1a1a" stroke-width="0.4"/>
      <!-- Body highlight -->
      <line x1="-1.0" y1="-2.6" x2="-1.0" y2="2.0"
            stroke="#FFFFFF" stroke-width="0.4"
            opacity="0.7" stroke-linecap="round"/>
      <!-- Ferrule -->
      <rect x="-1.6" y="-4.4" width="3.2" height="1.6"
            fill="#A8B0B8"
            stroke="#1a1a1a" stroke-width="0.3"/>
      <!-- Eraser (pink) -->
      <rect x="-1.5" y="-5.6" width="3.0" height="1.4"
            rx="0.3"
            fill="#D04040"
            stroke="#1a1a1a" stroke-width="0.3"/>
    </g>
  </g>

</svg>
