<?xml version="1.0" encoding="UTF-8"?>
<!--
  Save_blue.svg — ANVIL CAD "Save" toolbar icon, blue floppy matching the
  Save As / Save As Backup palette (replaces the grey native Save icon).
  24 x 24, blue body + silver shutter + white label (no pencil badge).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><defs><linearGradient id="bncGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1fb5ac"/><stop offset="1" stop-color="#056b6b"/></linearGradient></defs>
  <defs>
    <linearGradient id="svBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#088f8f"/>
      <stop offset="100%" stop-color="#056b6b"/>
    </linearGradient>
    <linearGradient id="svShut" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#DCE2EA"/>
      <stop offset="100%" stop-color="#6A727A"/>
    </linearGradient>
  </defs>
  <!-- floppy body (notched upper-right corner) -->
  <path d="M 1.5 1.5 L 17.5 1.5 L 22.5 6.5 L 22.5 22.5 L 1.5 22.5 Z"
        fill="url(#svBody)" stroke="#056b6b" stroke-width="1.3"
        stroke-linejoin="round"/>
  <line x1="2.3" y1="2.3" x2="17" y2="2.3" stroke="#4cbcbc"
        stroke-width="0.6" opacity="0.85" stroke-linecap="round"/>
  <!-- metal shutter (top center) -->
  <rect x="5" y="1.5" width="11" height="6" fill="url(#svShut)"
        stroke="#056b6b" stroke-width="1.0"/>
  <rect x="11" y="3" width="2.5" height="3" fill="#2A3038"
        stroke="#056b6b" stroke-width="0.45"/>
  <!-- white label (lower area) -->
  <rect x="4" y="11" width="16" height="10" rx="0.6" fill="#F3F6FA"
        stroke="#056b6b" stroke-width="1.0"/>
  <g stroke="#088f8f" stroke-linecap="round">
    <line x1="6" y1="14"   x2="16" y2="14"   stroke-width="1.2"/>
    <line x1="6" y1="16.5" x2="18" y2="16.5" stroke-width="1.0" opacity="0.8"/>
    <line x1="6" y1="19"   x2="14" y2="19"   stroke-width="1.0" opacity="0.65"/>
  </g>
</svg>
