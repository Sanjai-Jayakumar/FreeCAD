<?xml version="1.0" encoding="UTF-8"?>
<!--
  Apply_Material.svg
  FreeCAD "Apply Material" macro - toolbar icon
  Size   : 24 x 24 px (native FreeCAD toolbar size)
  Concept: a large 3D iso part filling the canvas, with a material
           "M" badge clipped to its lower-right corner. Matches the
           "big primary subject + corner badge" pattern of
           SetWorkingDirectory.svg.
  Palette: FreeCAD blue (#4cbcbc / #088f8f / #056b6b)
           Material yellow-orange (#f39c12 / #f39c12 / #6e4a0a)
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="24" height="24"
     viewBox="0 0 24 24">

  <defs>
    <linearGradient id="topF" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#4cbcbc"/>
      <stop offset="100%" stop-color="#088f8f"/>
    </linearGradient>
    <linearGradient id="leftF" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#088f8f"/>
      <stop offset="100%" stop-color="#056b6b"/>
    </linearGradient>
    <linearGradient id="rightF" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#088f8f"/>
      <stop offset="100%" stop-color="#044a4a"/>
    </linearGradient>
    <radialGradient id="badge" cx="0.35" cy="0.35" r="0.85">
      <stop offset="0%"   stop-color="#ffe066"/>
      <stop offset="55%"  stop-color="#f39c12"/>
      <stop offset="100%" stop-color="#6e4a0a"/>
    </radialGradient>
  </defs>

  <!-- ═══════════════════════════════════════════════════
       LARGE ISO PART (fills the canvas)
       Top vertices: T(12,1.5) R(22.5,7) F(12,12.5) L(1.5,7)
       Body down to y=18 (front bottom y=23)
       ══════════════════════════════════════════════════ -->

  <!-- Left face -->
  <polygon points="1.5,7  12,12.5  12,23  1.5,17.5"
           fill="url(#leftF)"
           stroke="#044a4a" stroke-width="0.9"
           stroke-linejoin="round"/>

  <!-- Right face -->
  <polygon points="22.5,7  12,12.5  12,23  22.5,17.5"
           fill="url(#rightF)"
           stroke="#044a4a" stroke-width="0.9"
           stroke-linejoin="round"/>

  <!-- Top face -->
  <polygon points="12,1.5  22.5,7  12,12.5  1.5,7"
           fill="url(#topF)"
           stroke="#044a4a" stroke-width="0.9"
           stroke-linejoin="round"/>

  <!-- Top rim highlight -->
  <polyline points="2.2,7  12,2.0  21.8,7"
            fill="none" stroke="#4cbcbc"
            stroke-width="0.55" stroke-linecap="round"
            opacity="0.85"/>

  <!-- ═══════════════════════════════════════════════════
       MATERIAL BADGE  (lower-right, overlaps part corner)
       ══════════════════════════════════════════════════ -->
  <g transform="translate(17 17.5)">
    <!-- Outer ring -->
    <circle r="6.2" fill="url(#badge)"
            stroke="#1a1a1a" stroke-width="1.0"/>

    <!-- Highlight arc -->
    <path d="M -3.4,-3.0 A 4.6,4.6 0 0 1 3.0,-3.4"
          fill="none" stroke="#FFFFFF"
          stroke-width="0.75" stroke-linecap="round"
          opacity="0.75"/>

    <!-- "M" letter (material) -->
    <text x="0" y="2.5"
          font-family="Arial Black, Arial, sans-serif"
          font-size="8.5" font-weight="900"
          fill="#1a1a1a" text-anchor="middle">M</text>
  </g>

</svg>
