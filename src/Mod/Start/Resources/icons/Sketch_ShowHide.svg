<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" version="1.1" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
 <defs>
  <linearGradient id="sketchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
   <stop offset="0%" style="stop-color:#1263a8;stop-opacity:1" />
   <stop offset="100%" style="stop-color:#0d4d7d;stop-opacity:1" />
  </linearGradient>
 </defs>
 
 <!-- Sketch plane background -->
 <rect x="8" y="12" width="48" height="40" rx="2" fill="#e8f4f8" stroke="#1263a8" stroke-width="1.5"/>
 
 <!-- Sketch constraints/lines -->
 <g stroke="#1263a8" stroke-width="2" fill="none" stroke-linecap="round">
   <!-- Horizontal line -->
   <line x1="14" y1="24" x2="50" y2="24"/>
   <!-- Vertical line -->
   <line x1="32" y1="18" x2="32" y2="46"/>
   <!-- Circle -->
   <circle cx="32" cy="32" r="8"/>
   <!-- Dimension lines -->
   <path d="M 20,40 L 44,40" stroke-dasharray="2,2"/>
 </g>
 
 <!-- Constraint symbols (small circles at intersections) -->
 <circle cx="32" cy="24" r="2" fill="#ff6b35"/>
 <circle cx="24" cy="32" r="2" fill="#ff6b35"/>
 <circle cx="40" cy="32" r="2" fill="#ff6b35"/>
 
 <!-- Eye icon overlay (show/hide indicator) -->
 <g transform="translate(42, 8)">
   <!-- Eye background -->
   <ellipse cx="10" cy="8" rx="11" ry="7" fill="white" stroke="#1263a8" stroke-width="1"/>
   <!-- Eye outline -->
   <path d="M 2,8 Q 10,2 18,8 Q 10,14 2,8 Z" fill="none" stroke="#1263a8" stroke-width="1.5"/>
   <!-- Pupil -->
   <circle cx="10" cy="8" r="3" fill="#1263a8"/>
   <circle cx="10" cy="8" r="1.5" fill="white"/>
 </g>
</svg>
