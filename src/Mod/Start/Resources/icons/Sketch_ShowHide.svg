<?xml version="1.0" encoding="UTF-8"?>
<!--
  SketchDisplay.svg
  FreeCAD "Sketch Display ON/OFF" macro - toolbar icon
  Size   : 24 x 24 px (native FreeCAD toolbar size)
  Concept: a 2D sketch profile (lines + arc + vertex dots, with one
           construction line) filling the canvas, plus a yellow eye
           visibility badge in the lower-right corner.
  Palette: Yellow + blue FreeCAD Assembly theme.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="24" height="24"
     viewBox="0 0 24 24">

  <defs>
    <radialGradient id="vertexFill" cx="0.35" cy="0.35" r="0.85">
      <stop offset="0%"   stop-color="#ffe066"/>
      <stop offset="55%"  stop-color="#f39c12"/>
      <stop offset="100%" stop-color="#c17d0c"/>
    </radialGradient>
    <radialGradient id="badgeBg" cx="0.35" cy="0.35" r="0.85">
      <stop offset="0%"   stop-color="#ffe066"/>
      <stop offset="55%"  stop-color="#f39c12"/>
      <stop offset="100%" stop-color="#c17d0c"/>
    </radialGradient>
  </defs>

  <!-- ════════ CONSTRUCTION LINE (dashed, inside profile) ════════ -->
  <line x1="1" y1="17" x2="18" y2="1"
        stroke="#056b6b" stroke-width="0.9"
        stroke-linecap="round"
        stroke-dasharray="2.4 1.8"
        opacity="0.6"/>

  <!-- ════════ SKETCH PROFILE (closed outline: lines + arc) ════════ -->
  <path d="M 1,18
           L 1,1
           L 13,1
           Q 19,1 19,7
           L 19,18
           Z"
        fill="#E8F1FA"
        stroke="#056b6b" stroke-width="1.8"
        stroke-linejoin="round"
        stroke-linecap="round"
        fill-opacity="0.55"/>

  <!-- ════════ SKETCH VERTICES (yellow filled dots at endpoints) ════════ -->
  <circle cx="1" cy="18" r="1.8"
          fill="url(#vertexFill)"
          stroke="#056b6b" stroke-width="0.8"/>
  <circle cx="1" cy="1" r="1.8"
          fill="url(#vertexFill)"
          stroke="#056b6b" stroke-width="0.8"/>
  <circle cx="13" cy="1" r="1.8"
          fill="url(#vertexFill)"
          stroke="#056b6b" stroke-width="0.8"/>
  <circle cx="19" cy="7" r="1.8"
          fill="url(#vertexFill)"
          stroke="#056b6b" stroke-width="0.8"/>
  <circle cx="19" cy="18" r="1.8"
          fill="url(#vertexFill)"
          stroke="#056b6b" stroke-width="0.8"/>

  <!-- ════════ EYE / VISIBILITY BADGE (lower-right corner) ════════ -->
  <g transform="translate(19 19.5)">
    <circle r="5.0"
            fill="url(#badgeBg)"
            stroke="#1a1a1a" stroke-width="1.0"/>
    <path d="M -2.7,-2.3 A 3.6 3.6 0 0 1 2.3,-2.7"
          fill="none" stroke="#FFFFFF"
          stroke-width="0.6" stroke-linecap="round"
          opacity="0.75"/>

    <!-- Eye almond -->
    <path d="M -3.4,0 Q 0,-2.7 3.4,0 Q 0,2.7 -3.4,0 Z"
          fill="#FFFFFF"
          stroke="#1a1a1a" stroke-width="0.75"
          stroke-linejoin="round"/>
    <circle r="1.3" fill="#088f8f"
            stroke="#056b6b" stroke-width="0.4"/>
    <circle r="0.65" fill="#1a1a1a"/>
    <circle cx="-0.5" cy="-0.5" r="0.35"
            fill="#FFFFFF"/>
  </g>

</svg>
