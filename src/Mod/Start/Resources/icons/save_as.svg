<?xml version="1.0" encoding="UTF-8"?>
<!--
  SaveAs.svg
  FreeCAD "Save As" macro - toolbar icon
  Size   : 24 x 24 px (native FreeCAD toolbar size)
  Concept: a large 3D blue floppy disk (universal save symbol) filling the
           canvas, with a yellow editable name label and a yellow pencil
           badge in the lower-right corner indicating "as new name."
  Palette: Yellow + blue FreeCAD Assembly theme.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="24" height="24"
     viewBox="0 0 24 24">

  <defs>
    <linearGradient id="floppyBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#4A8FE5"/>
      <stop offset="100%" stop-color="#0F3F8F"/>
    </linearGradient>
    <linearGradient id="shutter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#DCE2EA"/>
      <stop offset="100%" stop-color="#6A727A"/>
    </linearGradient>
    <linearGradient id="labelFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFE066"/>
      <stop offset="100%" stop-color="#FFCC00"/>
    </linearGradient>
    <radialGradient id="badgeBg" cx="0.35" cy="0.35" r="0.85">
      <stop offset="0%"   stop-color="#FFEE99"/>
      <stop offset="55%"  stop-color="#FFCC00"/>
      <stop offset="100%" stop-color="#8A6800"/>
    </radialGradient>
  </defs>

  <!-- ════════ FLOPPY DISK BODY (notched upper-right corner) ════════ -->
  <path d="M 1.5,1.5
           L 17.5,1.5
           L 22.5,6.5
           L 22.5,22.5
           L 1.5,22.5 Z"
        fill="url(#floppyBody)"
        stroke="#0A2E60" stroke-width="1.3"
        stroke-linejoin="round"/>

  <!-- Top edge highlight -->
  <line x1="2.3" y1="2.3" x2="17" y2="2.3"
        stroke="#CCE6F5" stroke-width="0.6"
        opacity="0.85" stroke-linecap="round"/>

  <!-- ════════ METAL SHUTTER (top center) ════════ -->
  <rect x="5" y="1.5"
        width="11" height="6"
        fill="url(#shutter)"
        stroke="#0A2E60" stroke-width="1.0"/>
  <!-- Shutter notch (the slide groove) -->
  <rect x="11" y="3"
        width="2.5" height="3"
        fill="#2A3038"
        stroke="#0A2E60" stroke-width="0.45"/>

  <!-- ════════ YELLOW NAME LABEL (the editable filename area) ════════ -->
  <rect x="3" y="11"
        width="18" height="10"
        rx="0.6"
        fill="url(#labelFill)"
        stroke="#0A2E60" stroke-width="1.1"/>

  <!-- Label text lines -->
  <line x1="4.5" y1="13.8" x2="13" y2="13.8"
        stroke="#0A2E60" stroke-width="1.2"
        stroke-linecap="round"/>
  <line x1="4.5" y1="16.2" x2="16" y2="16.2"
        stroke="#0A2E60" stroke-width="1.0"
        stroke-linecap="round" opacity="0.85"/>
  <line x1="4.5" y1="18.6" x2="11" y2="18.6"
        stroke="#0A2E60" stroke-width="1.0"
        stroke-linecap="round" opacity="0.7"/>

  <!-- ════════ PENCIL BADGE (lower-right, "as new name") ════════ -->
  <g transform="translate(19 19.5)">
    <!-- Badge circle -->
    <circle r="4.5"
            fill="url(#badgeBg)"
            stroke="#1a1a1a" stroke-width="0.9"/>
    <!-- Highlight arc -->
    <path d="M -2.4,-2.1 A 3.2,3.2 0 0 1 2.1,-2.4"
          fill="none" stroke="#FFFFFF"
          stroke-width="0.55" stroke-linecap="round"
          opacity="0.75"/>

    <!-- Pencil inside the badge (diagonal -45°) -->
    <g transform="rotate(-45)">
      <!-- Graphite tip -->
      <polygon points="-0.7,2.7  0.7,2.7  0,3.9"
               fill="#1a1a1a"/>
      <!-- Body -->
      <rect x="-1.0" y="-2.3" width="2.0" height="5"
            fill="#FFFFFF"
            stroke="#1a1a1a" stroke-width="0.35"/>
      <!-- Ferrule -->
      <rect x="-1.1" y="-3.2" width="2.2" height="0.9"
            fill="#A8B0B8"
            stroke="#1a1a1a" stroke-width="0.3"/>
      <!-- Eraser -->
      <rect x="-1.0" y="-4.2" width="2.0" height="1.0"
            rx="0.25"
            fill="#D04040"
            stroke="#1a1a1a" stroke-width="0.3"/>
    </g>
  </g>

</svg>
