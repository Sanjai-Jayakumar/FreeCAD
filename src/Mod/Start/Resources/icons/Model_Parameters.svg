<?xml version="1.0" encoding="UTF-8"?>
<!--
  Model_Parameters.svg
  FreeCAD "Model Parameters" macro – toolbar icon
  Size   : 64 × 64 px
  Concept: an isometric 3-D block (parametric part) with orange dimension
           annotation arrows on two faces, wired by a leader line to a
           small parameter table (name = value rows) on the right — the
           classic "driven-dimension / spreadsheet parameter" metaphor.
  Palette: #2f5a8a / #1f3a5f / #14253d   (block body – blue steel)
           #8ab4d8 / #4a7aaa             (block highlight faces)
           #F39C12 / #FFB74D             (dimension arrows – orange)
           #f0f4fa / #c8d0da             (param table background)
           #2c3e50 / #546e7a             (table text lines)
           #1a2530                       (deep outlines)
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="64" height="64"
     viewBox="-2 0 62 58">

  <defs>
    <!-- Top face of the block (brightest) -->
    <linearGradient id="blockTop" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%"   stop-color="#8ab4d8"/>
      <stop offset="100%" stop-color="#4a7aaa"/>
    </linearGradient>

    <!-- Left face (mid tone) -->
    <linearGradient id="blockLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#3a6a9a"/>
      <stop offset="100%" stop-color="#1a3a60"/>
    </linearGradient>

    <!-- Right face (darkest) -->
    <linearGradient id="blockRight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#2a4e7a"/>
      <stop offset="100%" stop-color="#0e2040"/>
    </linearGradient>

    <!-- Param table background -->
    <linearGradient id="tableBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dce4ec"/>
    </linearGradient>

    <!-- Table header bar -->
    <linearGradient id="tableHeader" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#3a6a9a"/>
      <stop offset="100%" stop-color="#1f3a5f"/>
    </linearGradient>

    <!-- Block drop shadow -->
    <filter id="blockShadow" x="-15%" y="-15%" width="135%" height="135%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.4"/>
      <feOffset dx="1.5" dy="2.0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Table drop shadow -->
    <filter id="tableShadow" x="-15%" y="-15%" width="135%" height="135%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.9"/>
      <feOffset dx="1.0" dy="1.4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.40"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Arrowhead marker (orange) -->
    <marker id="arrEnd" markerWidth="5" markerHeight="4"
            refX="4.5" refY="2" orient="auto">
      <polygon points="0,0 5,2 0,4" fill="#F39C12"/>
    </marker>
    <marker id="arrStart" markerWidth="5" markerHeight="4"
            refX="0.5" refY="2" orient="auto-start-reverse">
      <polygon points="0,0 5,2 0,4" fill="#F39C12"/>
    </marker>
  </defs>

  <!-- ═══════════════════════════════════════════════════════
       ISOMETRIC BLOCK  (origin: cube top-centre at ~28,20)
       Iso projection: x→(+0.866, +0.5), y→(−0.866, +0.5), z→(0,−1)
       Block size: W=24, D=18, H=22 (visual units)
       Key vertices:
         Top face:  TF (28,10)  TR(52,22)  BC(28,34)  TL(4,22)
         Bottom:    BR(52,44)  BB(28,56)  BL(4,44)
       ══════════════════════════════════════════════════════ -->
  <g filter="url(#blockShadow)">

    <!-- Right face -->
    <polygon points="52,22  52,44  28,56  28,34"
             fill="url(#blockRight)"
             stroke="#0e2040" stroke-width="1.0"
             stroke-linejoin="round"/>

    <!-- Left face -->
    <polygon points="4,22  4,44  28,56  28,34"
             fill="url(#blockLeft)"
             stroke="#0e2040" stroke-width="1.0"
             stroke-linejoin="round"/>

    <!-- Top face -->
    <polygon points="28,10  52,22  28,34  4,22"
             fill="url(#blockTop)"
             stroke="#0e2040" stroke-width="1.0"
             stroke-linejoin="round"/>

    <!-- Top face rim highlight -->
    <polyline points="29,10.5  52,22  28,33.5"
              fill="none" stroke="#b8d4ee"
              stroke-width="0.7" stroke-linecap="round"
              opacity="0.8"/>

    <!-- Right edge highlight -->
    <line x1="52" y1="22" x2="52" y2="44"
          stroke="#6a9ac8" stroke-width="0.6"
          opacity="0.6"/>
  </g>

  <!-- ═══════════════════════════════════════════════════════
       DIMENSION ANNOTATIONS on the block
       ══════════════════════════════════════════════════════ -->

  <!-- ── Width dimension (along the top-front edge, above the block) ── -->
  <!-- extension lines drop from top-face front-left (4,22) and front-right (28,10) -->
  <line x1="4"  y1="22" x2="4"  y2="14"
        stroke="#F39C12" stroke-width="0.8"
        stroke-dasharray="1.5,1.2" stroke-linecap="round"/>
  <line x1="28" y1="10" x2="28" y2="2"
        stroke="#F39C12" stroke-width="0.8"
        stroke-dasharray="1.5,1.2" stroke-linecap="round"/>
  <!-- dimension arrow line (parallel to top-front edge) -->
  <line x1="5"  y1="14" x2="27" y2="2"
        stroke="#F39C12" stroke-width="1.1"
        stroke-linecap="round"
        marker-start="url(#arrStart)"
        marker-end="url(#arrEnd)"/>
  <!-- "W" label -->
  <text x="14" y="10"
        font-family="Arial, sans-serif" font-size="6"
        font-weight="bold" font-style="italic"
        fill="#F39C12" text-anchor="middle">W</text>

  <!-- ── Height dimension (along the left face, left of block) ── -->
  <!-- extension lines go left from TL (4,22) and BL (4,44) -->
  <line x1="4"  y1="22" x2="-1" y2="22"
        stroke="#F39C12" stroke-width="0.8"
        stroke-dasharray="1.5,1.2" stroke-linecap="round"/>
  <line x1="4"  y1="44" x2="-1" y2="44"
        stroke="#F39C12" stroke-width="0.8"
        stroke-dasharray="1.5,1.2" stroke-linecap="round"/>
  <!-- vertical arrow line -->
  <line x1="1" y1="23" x2="1" y2="43"
        stroke="#F39C12" stroke-width="1.1"
        stroke-linecap="round"
        marker-start="url(#arrStart)"
        marker-end="url(#arrEnd)"/>
  <!-- "H" label -->
  <text x="1" y="35"
        font-family="Arial, sans-serif" font-size="6"
        font-weight="bold" font-style="italic"
        fill="#F39C12" text-anchor="middle">H</text>

  <!-- ═══════════════════════════════════════════════════════
       LEADER LINE from block right-front edge to param table
       ══════════════════════════════════════════════════════ -->
  <path d="M 52,30 Q 58,30 58,22"
        fill="none" stroke="#F39C12"
        stroke-width="0.9" stroke-dasharray="2.0,1.5"
        stroke-linecap="round"/>

  <!-- ═══════════════════════════════════════════════════════
       PARAMETER TABLE  (upper-right corner)
       ══════════════════════════════════════════════════════ -->
  <g filter="url(#tableShadow)">

    <!-- Table card (right-side depth) -->
    <rect x="57" y="3" width="1.5" height="36"
          fill="#8a9aaa"/>

    <!-- Table card (bottom depth) -->
    <rect x="40" y="38" width="18.5" height="1.5"
          fill="#8a9aaa"/>

    <!-- Table background -->
    <rect x="40" y="3" width="18" height="36"
          rx="1.0"
          fill="url(#tableBack)"
          stroke="#1a2530" stroke-width="0.9"/>

    <!-- Header bar -->
    <rect x="40" y="3" width="18" height="6"
          rx="1.0"
          fill="url(#tableHeader)"/>
    <!-- Header label: "MP" -->
    <text x="49" y="7.8"
          font-family="Arial, sans-serif" font-size="5"
          font-weight="bold" fill="#ffffff"
          text-anchor="middle" letter-spacing="1">MP</text>

    <!-- Column divider -->
    <line x1="49" y1="9" x2="49" y2="38"
          stroke="#b0bcc8" stroke-width="0.7"/>

    <!-- Header bottom rule -->
    <line x1="40" y1="9" x2="58" y2="9"
          stroke="#1a3a5f" stroke-width="0.7"/>

    <!-- ── Rows ────────────────────────────────────────────── -->
    <!-- Row 1 (accent colour = orange for a "live" param) -->
    <rect x="40" y="9" width="18" height="7"
          fill="#FFF8E1" opacity="0.85"/>
    <text x="42.5" y="14.5" font-family="Arial, sans-serif"
          font-size="4.0" fill="#F39C12" font-weight="bold">W</text>
    <text x="51" y="14.5" font-family="Arial, sans-serif"
          font-size="4.0" fill="#2c3e50" text-anchor="middle">120</text>

    <line x1="40" y1="16" x2="58" y2="16"
          stroke="#c8d4e0" stroke-width="0.6"/>

    <!-- Row 2 -->
    <text x="42.5" y="21.5" font-family="Arial, sans-serif"
          font-size="4.0" fill="#F39C12" font-weight="bold">H</text>
    <text x="51" y="21.5" font-family="Arial, sans-serif"
          font-size="4.0" fill="#2c3e50" text-anchor="middle">80</text>

    <line x1="40" y1="23" x2="58" y2="23"
          stroke="#c8d4e0" stroke-width="0.6"/>

    <!-- Row 3 -->
    <text x="42.5" y="28.5" font-family="Arial, sans-serif"
          font-size="4.0" fill="#546e7a">D</text>
    <text x="51" y="28.5" font-family="Arial, sans-serif"
          font-size="4.0" fill="#2c3e50" text-anchor="middle">60</text>

    <line x1="40" y1="30" x2="58" y2="30"
          stroke="#c8d4e0" stroke-width="0.6"/>

    <!-- Row 4 -->
    <text x="42.5" y="35.5" font-family="Arial, sans-serif"
          font-size="4.0" fill="#546e7a">R</text>
    <text x="51" y="35.5" font-family="Arial, sans-serif"
          font-size="4.0" fill="#2c3e50" text-anchor="middle">12</text>

  </g>

</svg>
