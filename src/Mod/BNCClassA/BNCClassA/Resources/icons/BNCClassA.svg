<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- BNC Class-A Surface workbench: swept surface with zebra highlight + curvature comb -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2733"/>
      <stop offset="1" stop-color="#10161e"/>
    </linearGradient>
    <linearGradient id="surf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f6fb2"/>
      <stop offset="1" stop-color="#1565c0"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="62" height="62" rx="10" fill="url(#bg)" stroke="#3b4a5c" stroke-width="1.5"/>
  <!-- surface patch -->
  <path d="M 8 44 C 20 30, 36 26, 56 30 L 56 44 C 40 38, 24 42, 8 54 Z" fill="url(#surf)" opacity="0.92"/>
  <!-- zebra stripes flowing over the patch -->
  <path d="M 14 48.5 C 22 40, 34 34, 52 34.5" fill="none" stroke="#e8eef5" stroke-width="2.6" opacity="0.9"/>
  <path d="M 12 51.5 C 24 43, 38 38.5, 55 39" fill="none" stroke="#e8eef5" stroke-width="1.6" opacity="0.55"/>
  <!-- curvature comb on the crown curve -->
  <path d="M 8 32 C 22 18, 40 14, 56 18" fill="none" stroke="#f5b942" stroke-width="2.4" stroke-linecap="round"/>
  <g stroke="#f5b942" stroke-width="1.3" opacity="0.85">
    <line x1="14" y1="27.5" x2="12" y2="20"/>
    <line x1="21" y1="22.5" x2="20" y2="14"/>
    <line x1="29" y1="18.8" x2="29" y2="9.5"/>
    <line x1="38" y1="16.6" x2="39" y2="8"/>
    <line x1="47" y1="16.4" x2="49" y2="9"/>
  </g>
  <path d="M 12 20 C 18 14.5, 28 9, 39 8 C 43 8, 47 8.5, 49 9" fill="none" stroke="#f5b942" stroke-width="1.1" opacity="0.6"/>
</svg>
