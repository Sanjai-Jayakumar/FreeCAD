<?xml version="1.0" encoding="UTF-8"?>
<!--
  PointsDisplay.svg
  FreeCAD "Points Display ON/OFF" macro - toolbar icon
  Size   : 24 x 24 px (native FreeCAD toolbar size)
  Concept: a single large datum point (yellow 3D sphere) filling the
           canvas, with a yellow eye visibility badge in the lower-right
           corner.
  Palette: Yellow + blue FreeCAD Assembly theme.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="24" height="24"
     viewBox="0 0 24 24">

  <defs>
    <radialGradient id="pointBody" cx="0.3" cy="0.28" r="0.9">
      <stop offset="0%"   stop-color="#ffe066"/>
      <stop offset="45%"  stop-color="#f39c12"/>
      <stop offset="100%" stop-color="#c17d0c"/>
    </radialGradient>
    <radialGradient id="badgeBg" cx="0.35" cy="0.35" r="0.85">
      <stop offset="0%"   stop-color="#ffe066"/>
      <stop offset="55%"  stop-color="#f39c12"/>
      <stop offset="100%" stop-color="#c17d0c"/>
    </radialGradient>
  </defs>

  <!-- ════════ DATUM POINT (single, large 3D sphere) ════════ -->
  <circle cx="10" cy="10" r="9"
          fill="url(#pointBody)"
          stroke="#056b6b" stroke-width="1.4"/>
  <!-- Specular highlight -->
  <ellipse cx="6.5" cy="6.5" rx="2.6" ry="1.6"
           fill="#FFFFFF" opacity="0.75"/>
  <!-- Catchlight -->
  <circle cx="5.7" cy="5.7" r="0.9" fill="#FFFFFF"/>

  <!-- ════════ EYE / VISIBILITY BADGE (lower-right corner) ════════ -->
  <g transform="translate(19 19.5)">
    <circle r="5.0"
            fill="url(#badgeBg)"
            stroke="#1a1a1a" stroke-width="1.0"/>
    <path d="M -2.7,-2.3 A 3.6 3.6 0 0 1 2.3,-2.7"
          fill="none" stroke="#FFFFFF"
          stroke-width="0.6" stroke-linecap="round"
          opacity="0.75"/>

    <!-- Eye almond -->
    <path d="M -3.4,0 Q 0,-2.7 3.4,0 Q 0,2.7 -3.4,0 Z"
          fill="#FFFFFF"
          stroke="#1a1a1a" stroke-width="0.75"
          stroke-linejoin="round"/>
    <circle r="1.3" fill="#088f8f"
            stroke="#056b6b" stroke-width="0.4"/>
    <circle r="0.65" fill="#1a1a1a"/>
    <circle cx="-0.5" cy="-0.5" r="0.35"
            fill="#FFFFFF"/>
  </g>

</svg>
