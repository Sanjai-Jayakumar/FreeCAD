<?xml version="1.0" encoding="UTF-8"?>
<!--
  AxisDisplay.svg
  FreeCAD "Axis Display ON/OFF" macro - toolbar icon
  Size   : 24 x 24 px (native FreeCAD toolbar size)
  Concept: an authentic CAD-style datum axis - dash-dot-dash centerline
           pattern with perpendicular end tick marks. Plus a yellow eye
           visibility badge in the lower-right corner.
  Palette: Yellow + blue FreeCAD Assembly theme.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="24" height="24"
     viewBox="0 0 24 24">

  <defs>
    <radialGradient id="badgeBg" cx="0.35" cy="0.35" r="0.85">
      <stop offset="0%"   stop-color="#FFEE99"/>
      <stop offset="55%"  stop-color="#FFCC00"/>
      <stop offset="100%" stop-color="#8A6800"/>
    </radialGradient>
  </defs>

  <!-- ════════ AXIS CENTERLINE (dash-dot-dash, tilted -25°) ════════ -->
  <g transform="rotate(-25 12 12)">

    <!-- Thin halo behind centerline for depth -->
    <line x1="12" y1="-1" x2="12" y2="25"
          stroke="#FFCC00" stroke-width="3.6"
          stroke-linecap="round" opacity="0.5"/>

    <!-- Classic CAD centerline pattern: long-gap-short-gap (dash-dot-dash) -->
    <line x1="12" y1="-1" x2="12" y2="25"
          stroke="#0A2E60" stroke-width="2.2"
          stroke-linecap="butt"
          stroke-dasharray="5 1.8 1 1.8"/>

  </g>

  <!-- ════════ EYE / VISIBILITY BADGE (lower-right corner) ════════ -->
  <g transform="translate(19 19.5)">
    <circle r="5.0"
            fill="url(#badgeBg)"
            stroke="#1a1a1a" stroke-width="1.0"/>
    <path d="M -2.7,-2.3 A 3.6 3.6 0 0 1 2.3,-2.7"
          fill="none" stroke="#FFFFFF"
          stroke-width="0.6" stroke-linecap="round"
          opacity="0.75"/>

    <!-- Eye almond -->
    <path d="M -3.4,0 Q 0,-2.7 3.4,0 Q 0,2.7 -3.4,0 Z"
          fill="#FFFFFF"
          stroke="#1a1a1a" stroke-width="0.75"
          stroke-linejoin="round"/>
    <circle r="1.3" fill="#1F66CC"
            stroke="#0A2E60" stroke-width="0.4"/>
    <circle r="0.65" fill="#1a1a1a"/>
    <circle cx="-0.5" cy="-0.5" r="0.35"
            fill="#FFFFFF"/>
  </g>

</svg>
