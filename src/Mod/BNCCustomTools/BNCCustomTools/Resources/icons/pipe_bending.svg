<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
    xmlns="http://www.w3.org/2000/svg"
    width="24"
    height="24"
    viewBox="0 0 24 24">

    <!-- Background (optional, transparent) -->
    <rect x="0" y="0" width="24" height="24" fill="none"/>

    <!-- Pipe (bent shape) -->
    <path
        d="M6 18
           A8 8 0 0 1 18 6"
        fill="none"
        stroke="#2E86C1"
        stroke-width="3"
        stroke-linecap="round"/>

    <!-- Pipe thickness (inner line) -->
    <path
        d="M8 18
           A6 6 0 0 1 18 8"
        fill="none"
        stroke="#85C1E9"
        stroke-width="1.5"
        stroke-linecap="round"/>

    <!-- Bend indicator arrow -->
    <polygon
        points="16,4 20,4 18,8"
        fill="#E67E22"/>

</svg>
