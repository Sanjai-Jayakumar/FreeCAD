<?xml version="1.0" encoding="UTF-8"?>
<!--
  PipeBendingTable.svg
  FreeCAD "Pipe Bending Table" macro - toolbar icon
  Size   : 24 x 24 px
  Concept: yellow protractor behind a 3D-shaded L-bent pipe. The protractor
           tick marks reference the bend angle being tabulated. Single
           dominant subject, strong "bend angle" reading.
  Palette: Yellow protractor + blue pipe (FreeCAD Assembly theme).
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="24" height="24"
     viewBox="0 0 24 24">

  <defs>
    <linearGradient id="protBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#f39c12"/>
    </linearGradient>
    <linearGradient id="pipeBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#4cbcbc"/>
      <stop offset="55%"  stop-color="#088f8f"/>
      <stop offset="100%" stop-color="#056b6b"/>
    </linearGradient>
  </defs>

  <!-- ════════ PROTRACTOR (yellow semicircle backdrop) ════════ -->
  <!-- Filled semicircle body -->
  <path d="M 1,19 A 11,11 0 0,1 23,19 L 1,19 Z"
        fill="url(#protBg)"
        stroke="#c17d0c" stroke-width="1.0"
        stroke-linejoin="round"/>

  <!-- Inner cutout makes it look like a real protractor ring -->
  <path d="M 5,19 A 7,7 0 0,1 19,19 L 5,19 Z"
        fill="#FFFFFF"
        stroke="#c17d0c" stroke-width="0.7"/>

  <!-- Tick marks around the outer arc (cardinal + 30° intervals) -->
  <!-- 0° (right) -->
  <line x1="23" y1="19" x2="21" y2="19"
        stroke="#222222" stroke-width="0.8" stroke-linecap="round"/>
  <!-- 180° (left) -->
  <line x1="1" y1="19" x2="3" y2="19"
        stroke="#222222" stroke-width="0.8" stroke-linecap="round"/>
  <!-- 90° (top) - longer tick -->
  <line x1="12" y1="8" x2="12" y2="10.5"
        stroke="#222222" stroke-width="1.0" stroke-linecap="round"/>
  <!-- 30° -->
  <line x1="21.52" y1="13.5" x2="19.81" y2="14.5"
        stroke="#222222" stroke-width="0.7" stroke-linecap="round"/>
  <!-- 60° -->
  <line x1="17.5" y1="9.47" x2="16.5" y2="11.18"
        stroke="#222222" stroke-width="0.7" stroke-linecap="round"/>
  <!-- 120° -->
  <line x1="6.5" y1="9.47" x2="7.5" y2="11.18"
        stroke="#222222" stroke-width="0.7" stroke-linecap="round"/>
  <!-- 150° -->
  <line x1="2.48" y1="13.5" x2="4.19" y2="14.5"
        stroke="#222222" stroke-width="0.7" stroke-linecap="round"/>

  <!-- Highlighted angle wedge (darker amber, upper-left quadrant 90°-180°) -->
  <path d="M 12,19 L 1,19 A 11,11 0 0,1 12,8 Z"
        fill="#f39c12" opacity="0.35"/>

  <!-- ════════ PIPE (L-bend, lies on protractor) ════════ -->
  <!-- Horizontal leg outer shadow -->
  <line x1="0" y1="19" x2="12" y2="19"
        stroke="#044a4a" stroke-width="6"
        stroke-linecap="butt"/>
  <!-- Vertical leg outer shadow -->
  <line x1="12" y1="19" x2="12" y2="2"
        stroke="#044a4a" stroke-width="6"
        stroke-linecap="butt"/>

  <!-- Horizontal leg body -->
  <line x1="0" y1="19" x2="12" y2="19"
        stroke="url(#pipeBody)" stroke-width="4.4"
        stroke-linecap="butt"/>
  <!-- Vertical leg body -->
  <line x1="12" y1="19" x2="12" y2="2"
        stroke="url(#pipeBody)" stroke-width="4.4"
        stroke-linecap="butt"/>

  <!-- Pipe highlight stripes -->
  <line x1="0" y1="17.5" x2="12" y2="17.5"
        stroke="#4cbcbc" stroke-width="0.7" opacity="0.85"/>
  <line x1="10.5" y1="2" x2="10.5" y2="17.5"
        stroke="#4cbcbc" stroke-width="0.7" opacity="0.85"/>

  <!-- Pipe end caps (tube openings) -->
  <ellipse cx="0" cy="19" rx="0.7" ry="2.2"
           fill="#044a4a"/>
  <ellipse cx="12" cy="2" rx="2.2" ry="0.7"
           fill="#044a4a"/>

  <!-- Pivot dot at bend center -->
  <circle cx="12" cy="19" r="1.3"
          fill="#222222"
          stroke="#FFFFFF" stroke-width="0.5"/>

</svg>
