<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Solid body with a through-hole -->
  <rect x="6" y="10" width="52" height="44" rx="3" fill="#2e75b6" stroke="#1f4e79" stroke-width="2"/>
  <!-- Through-hole (white = open) -->
  <ellipse cx="32" cy="32" rx="14" ry="10" fill="white" stroke="#1f4e79" stroke-width="2"/>
  <!-- Shut-off surface patch (cyan fill) -->
  <ellipse cx="32" cy="32" rx="14" ry="10" fill="#7fd8f8" stroke="#0070c0" stroke-width="2" stroke-dasharray="4,2" opacity="0.85"/>
  <!-- Surface crosshatch to indicate filled surface -->
  <line x1="22" y1="28" x2="42" y2="36" stroke="#0070c0" stroke-width="1" opacity="0.7"/>
  <line x1="22" y1="32" x2="42" y2="32" stroke="#0070c0" stroke-width="1" opacity="0.7"/>
  <line x1="22" y1="36" x2="42" y2="28" stroke="#0070c0" stroke-width="1" opacity="0.7"/>
</svg>
