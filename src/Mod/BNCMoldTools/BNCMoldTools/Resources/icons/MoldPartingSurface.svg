<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Top block (cavity) -->
  <rect x="8" y="4" width="48" height="20" rx="2" fill="#2e75b6" stroke="#1f4e79" stroke-width="2"/>
  <!-- Parting surface (flat plane) -->
  <rect x="2" y="26" width="60" height="8" rx="1" fill="#9dc3e6" stroke="#0070c0" stroke-width="2"/>
  <!-- Surface hatch lines -->
  <line x1="14" y1="26" x2="14" y2="34" stroke="#0070c0" stroke-width="1"/>
  <line x1="24" y1="26" x2="24" y2="34" stroke="#0070c0" stroke-width="1"/>
  <line x1="34" y1="26" x2="34" y2="34" stroke="#0070c0" stroke-width="1"/>
  <line x1="44" y1="26" x2="44" y2="34" stroke="#0070c0" stroke-width="1"/>
  <line x1="54" y1="26" x2="54" y2="34" stroke="#0070c0" stroke-width="1"/>
  <!-- Bottom block (core) -->
  <rect x="8" y="36" width="48" height="24" rx="2" fill="#ed7d31" stroke="#c05800" stroke-width="2"/>
</svg>
