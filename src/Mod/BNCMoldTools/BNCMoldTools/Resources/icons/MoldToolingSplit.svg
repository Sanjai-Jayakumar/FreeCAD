<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Cavity block (top, slightly offset upward) -->
  <rect x="8" y="2" width="48" height="24" rx="2" fill="#2e75b6" stroke="#1f4e79" stroke-width="2"/>
  <!-- Cavity pocket cut -->
  <ellipse cx="32" cy="26" rx="14" ry="8" fill="#9dc3e6" stroke="#1f4e79" stroke-width="1"/>
  <!-- Split gap -->
  <line x1="4" y1="32" x2="60" y2="32" stroke="#ffc000" stroke-width="2.5"/>
  <!-- Core block (bottom, slightly offset downward) -->
  <rect x="8" y="36" width="48" height="24" rx="2" fill="#ed7d31" stroke="#c05800" stroke-width="2"/>
  <!-- Core bump -->
  <ellipse cx="32" cy="36" rx="12" ry="7" fill="#f4b183" stroke="#c05800" stroke-width="1"/>
  <!-- Split arrows -->
  <polygon points="14,28 10,32 18,32" fill="#ffc000"/>
  <polygon points="50,36 46,32 54,32" fill="#ffc000"/>
</svg>
