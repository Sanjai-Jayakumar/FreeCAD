<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Drawing sheet background -->
  <rect x="4" y="8" width="56" height="48" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  
  <!-- Tolerance table structure -->
  <rect x="12" y="16" width="40" height="32" fill="#f0f8ff" stroke="#000000" stroke-width="1.5"/>
  
  <!-- Table header row (darker) -->
  <rect x="12" y="16" width="40" height="7" fill="#4682b4" stroke="#000000" stroke-width="1.5"/>
  
  <!-- Vertical column dividers -->
  <line x1="24" y1="16" x2="24" y2="48" stroke="#000000" stroke-width="1.2"/>
  <line x1="36" y1="16" x2="36" y2="48" stroke="#000000" stroke-width="1.2"/>
  
  <!-- Horizontal row dividers -->
  <line x1="12" y1="23" x2="52" y2="23" stroke="#000000" stroke-width="1"/>
  <line x1="12" y1="30" x2="52" y2="30" stroke="#000000" stroke-width="1"/>
  <line x1="12" y1="37" x2="52" y2="37" stroke="#000000" stroke-width="1"/>
  <line x1="12" y1="44" x2="52" y2="44" stroke="#000000" stroke-width="1"/>
  
  <!-- Header text representation (white lines) -->
  <line x1="14" y1="19.5" x2="22" y2="19.5" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="26" y1="19.5" x2="34" y2="19.5" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="38" y1="19.5" x2="50" y2="19.5" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Tolerance symbols representation -->
  <!-- Plus-minus symbol ± -->
  <text x="18" y="28" font-family="Arial" font-size="5" fill="#333333" text-anchor="middle">±</text>
  
  <!-- Dimension values (blue lines) -->
  <line x1="26" y1="26.5" x2="34" y2="26.5" stroke="#0066cc" stroke-width="1"/>
  <line x1="38" y1="26.5" x2="50" y2="26.5" stroke="#0066cc" stroke-width="1"/>
  
  <line x1="14" y1="33.5" x2="22" y2="33.5" stroke="#0066cc" stroke-width="1"/>
  <line x1="26" y1="33.5" x2="34" y2="33.5" stroke="#0066cc" stroke-width="1"/>
  <line x1="38" y1="33.5" x2="50" y2="33.5" stroke="#0066cc" stroke-width="1"/>
  
  <line x1="14" y1="40.5" x2="22" y2="40.5" stroke="#0066cc" stroke-width="1"/>
  <line x1="26" y1="40.5" x2="34" y2="40.5" stroke="#0066cc" stroke-width="1"/>
  <line x1="38" y1="40.5" x2="50" y2="40.5" stroke="#0066cc" stroke-width="1"/>
  
  <!-- Geometric tolerance symbol (circular feature control frame) -->
  <circle cx="18" cy="34" r="2.5" fill="none" stroke="#333333" stroke-width="0.8"/>
  <path d="M 16.5 34 L 19.5 34" stroke="#333333" stroke-width="0.8"/>
  
  <!-- Add indicator badge (green plus) -->
  <circle cx="50" cy="14" r="8" fill="#4CAF50" opacity="0.95"/>
  <path d="M 50 10 L 50 18 M 46 14 L 54 14" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
</svg>
