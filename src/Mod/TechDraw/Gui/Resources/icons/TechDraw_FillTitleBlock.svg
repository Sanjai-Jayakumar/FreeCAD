<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Drawing sheet -->
  <rect x="4" y="8" width="56" height="48" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  
  <!-- Drawing border -->
  <rect x="7" y="11" width="50" height="42" fill="none" stroke="#666666" stroke-width="1"/>
  
  <!-- Title block structure (right side) -->
  <rect x="32" y="38" width="24" height="14" fill="#e8f4f8" stroke="#000000" stroke-width="1.5"/>
  
  <!-- Title block grid lines -->
  <line x1="32" y1="42" x2="56" y2="42" stroke="#000000" stroke-width="0.8"/>
  <line x1="32" y1="46" x2="56" y2="46" stroke="#000000" stroke-width="0.8"/>
  <line x1="32" y1="49" x2="56" y2="49" stroke="#000000" stroke-width="0.8"/>
  
  <line x1="42" y1="38" x2="42" y2="52" stroke="#000000" stroke-width="0.8"/>
  <line x1="48" y1="42" x2="48" y2="52" stroke="#000000" stroke-width="0.8"/>
  
  <!-- Filled text indicators (blue lines representing text) -->
  <line x1="34" y1="40" x2="40" y2="40" stroke="#0066cc" stroke-width="1.2"/>
  <line x1="44" y1="40" x2="54" y2="40" stroke="#0066cc" stroke-width="1.2"/>
  
  <line x1="34" y1="44" x2="40" y2="44" stroke="#0066cc" stroke-width="1.2"/>
  <line x1="44" y1="44" x2="54" y2="44" stroke="#0066cc" stroke-width="1.2"/>
  
  <line x1="34" y1="47.5" x2="40" y2="47.5" stroke="#0066cc" stroke-width="1.2"/>
  <line x1="44" y1="47.5" x2="46" y2="47.5" stroke="#0066cc" stroke-width="1.2"/>
  <line x1="50" y1="47.5" x2="54" y2="47.5" stroke="#0066cc" stroke-width="1.2"/>
  
  <line x1="34" y1="50.5" x2="40" y2="50.5" stroke="#0066cc" stroke-width="1.2"/>
  <line x1="44" y1="50.5" x2="54" y2="50.5" stroke="#0066cc" stroke-width="1.2"/>
  
  <!-- Auto-fill icon (pen with arrow) -->
  <circle cx="48" cy="20" r="11" fill="#FF9800" opacity="0.9"/>
  
  <!-- Pen icon -->
  <path d="M 45 25 L 47 23 L 51 27 L 49 29 Z" fill="#ffffff"/>
  <path d="M 47 23 L 49 21 L 50 22 L 48 24 Z" fill="#ffffff"/>
  <circle cx="43.5" cy="26.5" r="0.8" fill="#ffffff"/>
  
  <!-- Downward arrow to indicate filling -->
  <path d="M 48 13 L 48 17 M 46 15 L 48 17 L 50 15" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round"/>
</svg>
