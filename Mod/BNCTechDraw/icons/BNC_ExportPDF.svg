<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Document body -->
  <rect x="3" y="2" width="13" height="16" rx="1.5" ry="1.5" fill="#ffffff" stroke="#555555" stroke-width="1.2"/>
  <!-- Folded corner -->
  <polyline points="12,2 12,6 16,6" fill="#dddddd" stroke="#555555" stroke-width="1.2"/>
  <!-- PDF red badge -->
  <rect x="2" y="13" width="14" height="6" rx="1" ry="1" fill="#cc2200"/>
  <!-- PDF text -->
  <text x="9" y="18.2" font-family="Arial" font-weight="bold" font-size="4.5" fill="#ffffff" text-anchor="middle">PDF</text>
  <!-- Down arrow -->
  <line x1="20" y1="9" x2="20" y2="19" stroke="#17a3a3" stroke-width="2" stroke-linecap="round"/>
  <polyline points="17,16.5 20,20 23,16.5" fill="none" stroke="#17a3a3" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
